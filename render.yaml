services:
  - type: web
    name: neuropay-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: neuropay-db
          property: connectionString
      - key: PGSSL
        value: enable

databases:
  - name: neuropay-db
    plan: free
    region: frankfurt
    databaseName: neuropay
    user: neuropay
